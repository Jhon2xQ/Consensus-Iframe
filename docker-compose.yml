version: "3.8"
services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-hot-storage
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keymanagement}"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastify-app:
    build: .
    container_name: fastify-key-management
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - INFISICAL_COLD_PROJECT_ID=${INFISICAL_COLD_PROJECT_ID}
      - INFISICAL_COLD_CLIENT_ID=${INFISICAL_COLD_CLIENT_ID}
      - INFISICAL_COLD_CLIENT_SECRET=${INFISICAL_COLD_CLIENT_SECRET}
      - INFISICAL_ENVIRONMENT=${INFISICAL_ENVIRONMENT}
      - CORS_ORIGIN=${CORS_ORIGIN}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
